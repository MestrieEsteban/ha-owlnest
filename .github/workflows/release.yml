name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ha-3d-floorplan.js
          generate_release_notes: true
          body: |
            Owlnest — your home in 3D, right inside Home Assistant.

            ### Highlights

            - 🏠 Load any GLB/GLTF model with free camera navigation
            - 💡 Real-time synchronized lights (color, brightness, smooth transitions)
            - 📍 Interactive anchors for lights, sensors, covers, climate, media players
            - 🃏 3D scene cards (Room, Entity, Info) with billboard rendering
            - 🎥 Named camera views with fly-to animation
            - ⚡ Rules engine (trigger → conditions → actions)
            - 🌦️ Dynamic weather and realistic sun from HA entities
            - 🎨 Full visual editor, no YAML needed
            - 🌍 English and French included

            ### Install

            **HACS** → Custom repositories → `https://github.com/MestrieEsteban/ha-owlnest` (Plugin)

            **Manual** → Download `ha-3d-floorplan.js` below, place it in `config/www/` and add it as a Lovelace resource.

            Both methods require the backend integration: copy `custom_components/owlnest/` to your HA config.
