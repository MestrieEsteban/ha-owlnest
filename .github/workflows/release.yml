name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ha-3d-floorplan.js
          generate_release_notes: true
          body: |
            ## Install via HACS
            Add this repository as a custom HACS repository (category: Plugin).

            ## Manual install
            Download `ha-3d-floorplan.js`, place it in `config/www/` and add it as a Lovelace resource.
