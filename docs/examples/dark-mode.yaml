# Dark mode — no sky, dark background, dramatic lighting
# Works great with RGB lights and a dark-themed dashboard.

type: custom:ha-3d-floorplan
model_url: /local/floorplan.glb
height: 700
intensity_scale: 0.4

rendering:
  sky: false
  background_color: "#080c14"
  exposure: 1.1
  ambient_intensity: 0.15
  sun_intensity: 0.0
  shadows: true
  fog_density: 0.025
  ground_color: "#111827"

orbit:
  min_distance: 2
  max_distance: 18

lights:
  distance: 6
  decay: 2
  transition: 0.6

anchors:
  - entity: light.living_room
    label: "Living Room"
    position: [0.3, 0.18, -0.4]
  - entity: light.kitchen
    label: "Kitchen"
    position: [3.8, 0.18, 0.2]
