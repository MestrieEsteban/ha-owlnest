# Performance mode — for older devices and mobile
# Disables shadows, sky, and fog for maximum frame rate.

type: custom:ha-3d-floorplan
model_url: /local/floorplan.glb
height: 500

rendering:
  shadows: false
  sky: false
  fog_density: 0
  exposure: 1.2
  ambient_intensity: 0.9
  background_color: "#1a2035"

orbit:
  max_distance: 20

anchors:
  - entity: light.living_room
    label: "Living Room"
    position: [0.3, 0.18, -0.4]
  - entity: switch.main_outlet
    label: "Outlet"
    position: [1.5, 0.5, 0.8]
